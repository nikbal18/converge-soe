# =============================================================================
# converge-soe pipeline defaults.
#
# Precedence: CLI flags  >  config/feeders/<FEEDER>.yaml  >  this file.
# The fully resolved configuration for every run is written to
# out/<FEEDER>/<RUN_ID>/config_resolved.yaml, so a run is always reproducible.
# =============================================================================

# --- Scenarios ---------------------------------------------------------------
scenarios: [doe_dtr, doe_static, bau]   # which of the three to run

# --- Envelopes ---------------------------------------------------------------
envelope_abs_max: 50.0        # kW — hard cap on envelope half-width per NMI.
                              # Must exceed every participant's peak forecast
                              # magnitude (preflight MDL002), or the envelope is
                              # clipped by this parameter instead of the network.

# --- Transformer limit / thermal model ---------------------------------------
thermal:
  transformer_class: distribution_onan   # file in config/transformers/
  k_emergency: 2.0            # — hard mechanical/short-time backstop on the DTR
                              # limit, as a multiple of rated current. Bushings,
                              # tap changers and LV cabling do not get more
                              # capable when the oil is cold. K²_max is bracketed
                              # on [0, k_emergency²].
  k2_floor: 1.0e-6            # — floor on K²_max when the transformer is already
                              # over its hot-spot limit from stored heat
                              # ("already_over_limit"): keeps the problem feasible
                              # and visible instead of fatal.
  derive_i_rated: true        # derive I_rated per substation from s_max /
                              # v_secondary (recommended); false = use the value
                              # in the transformer class file for every substation.

tx_limit: dtr                 # dtr | static | legacy — transformer current limit
                              # mode for DOE scenarios (scenario definitions
                              # override this per scenario; the flag exists for
                              # single-scenario debugging).

# --- Network corrections ------------------------------------------------------
# The DMS LVNetwork export carries no tap data at all, so cim_to_json used to
# invent tap positions from defaults — on Gold Creek that shifted LV voltages
# by up to +7.5% and put 99.7% of nodes over the 1.10 pu limit before any load.
# Distribution transformer taps are off-load and never moved, so nominal is
# both the honest and the useful model. cim_to_json now emits nominal when the
# export has no RatioTapChanger; this override does the same for networks that
# were built before that change, so old build/ artefacts stay correct.
network:
  series_reduction: false     # merge chains of lines through nodes that carry
                              # no load, no transformer and no setpoint. Such a
                              # node injects nothing, so both branches carry the
                              # same current and collapse to one with
                              # r = r1+r2, x = x1+x2, i_max = min(i1, i2).
                              # EXACT, not an approximation: with no injection
                              # the voltage along the chain is monotonic, so the
                              # extreme is at an endpoint. Verified on the real
                              # networks — every load bus is retained and the
                              # source-to-load impedance is unchanged to 1e-16.
                              #
                              # LV models carry far more nodes than customers
                              # (poles, joints, cable changes): S_11038 has 950
                              # branches for 148 customers. Reduction gives
                              # 39-53% fewer branches, and the NLP scales
                              # superlinearly.
                              #
                              # OFF by default so that turning it on is always a
                              # deliberate, recorded choice — mixing reduced and
                              # unreduced runs in one study would not be
                              # comparable.
  fixed_lv_taps: true
  infeeder_v_setpoint_kv: null   # null = use the converted value (11.55 kV =
                                 # 1.05 pu). The turns ratio maps 11 kV to
                                 # 415 V on a 400 V node base — a real +3.75%
                                 # boost so the far end sits near 400 V after
                                 # volt drop — so 11.55 leaves the LV terminals
                                 # at 1.089 pu unloaded, with ~1% headroom.
                                 # Set 11.0 for 1.0375 pu and ~6% headroom.

# --- Load scaling (stress test) ----------------------------------------------
# Multiply every NMI's demand and/or PV export by a constant, applied to the
# normalised timeseries right after stage ②. Use it to push a lightly-loaded
# feeder into its thermal and voltage limits and see whether the DOEs actually
# bind — on unscaled data the envelopes are often slack, so DTR vs static looks
# identical and tells you nothing.
#
# Import and export scale independently: thermal limits bite at winter peak,
# voltage limits at midday export, and they are different questions.
#
# ANY value other than 1.0 makes the run COUNTERFACTUAL — a what-if, not a
# measurement. It is recorded in config_resolved.yaml so a run is never
# ambiguous. CLI: --scale-load 2 (both), or --scale-import / --scale-export.
scaling:
  import: 1.0                 # multiplies consumption (P >= 0)
  export: 1.0                 # multiplies PV export (P < 0)

# --- Synthetic profiles for NMIs without meter data --------------------------
# The meter export only covers NMIs that have measurements. Those without data
# are not columns in the pre-indexed bundle at all, so they contribute NOTHING
# to the power flow: the feeder looks unloaded and the envelopes come out too
# generous. Stage ⑤b fills them in. They load the network but never receive an
# envelope (no meter, no DOE). Run with --no-synthetic to reproduce the old
# behaviour and quantify the difference.
synthetic:
  enabled: true
  participants: false         # false (default, physical): synthetic NMIs have
                              # no meter, so they get no envelope and act as
                              # uncontrollable background load.
                              # true (diagnostic): treat them as dispatchable
                              # too. Not realistic — you cannot send a DOE to a
                              # customer you cannot measure — but it gives the
                              # UPPER BOUND on what DOEs could do for the
                              # transformer if every customer participated.
                              # The gap between the two runs is the cost of the
                              # missing metering. CLI: --synthetic-participate
  min_donors: 5               # below this many usable donors, sampling is
                              # meaningless and the transformer-disaggregation
                              # fallback is used. Counted against the
                              # FEEDER-WIDE pool (see allow_feeder_donors), so
                              # it guards against a feeder with almost no
                              # metered NMIs at all rather than a thin
                              # substation — it should effectively never fire.
  match_pv: true              # match donor rooftop PV to the target's
                              # user_data.der where the network has it
  without_replacement: true   # preserves the observed distribution rather than
                              # over-weighting repeat picks
  include_placeholder_loads: false   # cim_to_json LV dead-end stubs are
                                     # topology, not customers
  feeder_donor_bank: false    # widen the pool of allow_feeder_donors to the
                              # sibling .npz bundles on disk, i.e. to the
                              # substations NOT named in --only.
                              #
                              # Without it, allow_feeder_donors is only as
                              # wide as `bundles`, and --only puts one
                              # substation in bundles — so a single-substation
                              # run draws from that substation's own meters
                              # rather than the feeder's several hundred. On a
                              # thinly-metered substation that falls below
                              # min_donors and drops into the disaggregation
                              # fallback, which is not what the setting below
                              # says it does.
                              #
                              # OFF by default because turning it on changes
                              # the synthetic profiles, and therefore the
                              # bundle fingerprint, so existing runs would
                              # refuse to --resume. CLI: --feeder-donor-bank.
                              # Needs one prior whole-feeder pass to have
                              # written the sibling bundles.
  allow_feeder_donors: true   # draw from every metered NMI on the feeder, not
                              # just this substation. Consumption does not vary
                              # much geographically within a feeder, so a donor
                              # two substations away is as representative as one
                              # next door — and the larger pool avoids reusing
                              # the same profile many times, which would
                              # understate coincidence diversity. On Gold Creek
                              # this takes the pool from 49 to 376 for 72 gaps.
  max_donor_share: 0.20       # warn if one donor covers more than this share
                              # of a substation's synthetic load
  on_missing: error           # error | warn_zero — what to do when a thin
                              # substation has no transformer series to fall
                              # back on. warn_zero fills with zeros, which is
                              # only ever a deliberate baseline.
  seed: 42                    # re-run across seeds and compare the DOEs; the
                              # spread is the sensitivity to this assumption
  power_factor: 0.95          # for the fallback only (NEM12 is active-only)
  size_diversity: 0.6         # fallback: log-normal sigma on customer size
  temporal_diversity: 0.15    # fallback: deviation from the aggregate shape
  transformer_series: {}      # substation -> csv path (or {path:, column:})
                              # for the fallback. Must be an INDEPENDENT
                              # measurement: a meter-derived ESTIMATION column
                              # is a gross-up of the very meters being
                              # subtracted, and is therefore circular.

# --- Solver ------------------------------------------------------------------
solver:
  name: ipopt                 # AMPL-interface executable Pyomo can find. On the
                              # laptop ipopt is installed via conda — run from a
                              # conda-activated shell (docs/TROUBLESHOOTING.md).
  linear_solver: mumps        # mumps (open source) or ma27 (HSL, faster)
  fast: false                 # true = persistent mutable-Param model (--fast);
                              # validated against the plain path by
                              # tests/test_fast_path_equivalence.py
  max_cpu_time: 600           # s — wall-clock cap per solve. Without one, a
                              # single pathological interval ran 5189 s and
                              # held the whole run hostage. Losing that
                              # interval costs one row; losing the afternoon
                              # costs the run.
                              # Size it to the SUBSTATION: 120 s was ample at
                              # 28-96 NMIs but too tight for the larger
                              # 90-148 NMI substations, where it cut off
                              # solves that were still converging.
                              # Hitting the cap is now a recorded FAILURE, not
                              # a silently-accepted non-converged answer.
  retry_on_failure: true      # on a failed solve, retry that interval once
                              # with an adaptive barrier and relaxed bounds.
                              # Most failures are "Error in step computation"
                              # — the KKT factorisation giving up on a
                              # marginally-conditioned model, not genuine
                              # infeasibility — and the retry recovers many of
                              # them. Only failed intervals pay the cost.
  soft_limits: true           # add penalised slacks on voltage and current
                              # limits so "infeasible" becomes a quantified
                              # violation in viol.parquet instead of a missing row
  soft_limit_penalty: 1000.0  # $/kWh-equivalent objective penalty on those slacks
  options:                    # extra ipopt options passed straight through.
                              # These two cut iteration counts ~40% on the
                              # 150-NMI benchmark (docs/profile_after.txt);
                              # delete them to run at ipopt defaults.
    mu_strategy: adaptive
    tol: 1.0e-6
  usable_export_weight: 0.01  # small objective reward on min(doe_ub, desired
                              # export) per NMI: allocates envelope headroom to
                              # customers who can actually use it. Without it
                              # the per-NMI split of surplus capacity is
                              # mathematically degenerate and curtailment
                              # metrics become arbitrary. 0 = legacy behaviour.

# --- Execution ---------------------------------------------------------------
jobs: auto                    # parallel substations; auto = cpu_count - 1
flush_every: 200              # timesteps between parquet row-group flushes /
                              # checkpoints; smaller = less lost on crash,
                              # bigger = slightly faster
resume: true                  # continue from checkpoint when inputs fingerprint
                              # matches; a mismatch refuses and requires --restart
csv_mirror: false             # additionally write CSV next to every parquet

# --- Timeseries --------------------------------------------------------------
timeseries:
  values_are: null            # w | kw | kwh_per_interval — REQUIRED for wide
                              # meter exports (no silent unit guessing). Long
                              # format with real_power_w columns is taken as W.
  reactive_from_q: true       # use summed Q* channels when present; else
                              # reactive = pf_ratio × active
  pf_ratio: 0.4               # reactive/active ratio fallback
  fill_missing_with_zero: true  # gaps become 0 W and are flagged in the mask
  min_coverage: 0.90          # preflight TS004 warns below this per-NMI coverage

# --- Ambient temperature ------------------------------------------------------
ambient:
  source: cache               # cache | constant | open_meteo
  constant_c: 25.0            # used when source: constant
  site_lat: -35.2035          # central Canberra (Open-Meteo fetch)
  site_lon: 149.1548
  cache_dir: data/ambient

# --- Economics ---------------------------------------------------------------
curtailment_price_per_kwh: 0.10   # $ — flat price used to value curtailed
                                  # export (representative feed-in tariff).
                                  # AN ASSUMPTION, NOT A RESULT: it is printed
                                  # on every plot and table that uses it.
price_series_csv: null            # optional CSV (timestamp, price_per_kwh);
                                  # if set, each interval is valued at its own
                                  # price instead of the flat number above.

# --- Preflight ---------------------------------------------------------------
preflight:
  strict: true                # abort the run on any preflight ERROR
